version: "3.9"

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - business_os_net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: businessos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-businessos_secure_pwd}
      POSTGRES_DB: business_os_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U businessos -d business_os_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - business_os_net

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - business_os_net

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai-local"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - business_os_net

volumes:
  caddy_data:
  caddy_config:
  pg_data:
  redis_data:
  ollama_data:

networks:
  business_os_net:
    driver: bridge
